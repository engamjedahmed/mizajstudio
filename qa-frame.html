<!doctype html><html lang="en"><meta charset="utf-8"><title>Mizaj viewport inspection</title>
<style>html,body{margin:0;padding:0;background:#f7f6f3}iframe{display:block;border:0}</style>
<iframe title="Mizaj Studio responsive preview" src="/"></iframe>
<script type="module">
const params=new URLSearchParams(location.search);
const width=Math.max(320,Math.min(1600,Number(params.get('width'))||1440));
const height=Math.max(600,Math.min(1800,Number(params.get('height'))||1024));
const frame=document.querySelector('iframe');
frame.style.width=`${width}px`;frame.style.height=`${height}px`;
document.documentElement.style.width=`${width}px`;
document.body.style.width=`${width}px`;
</script></html>
